name: Desktop App Release

on:
  push:
    tags:
      - 'desktop-v*'   # git tag desktop-v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write  # needed to create GitHub releases

jobs:
  build:
    name: Build — ${{ matrix.platform }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — AppImage (portable) + .deb (Debian/Ubuntu installer)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64

          # Windows — .msi installer + .exe setup
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64

          # macOS Intel
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS Intel

          # macOS Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple Silicon

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Rust ──────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      # ── Linux system deps ─────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libglib2.0-dev

      # ── Install npm dependencies ───────────────────────────────────────────────
      # Install web app deps first — Tauri's beforeBuildCommand needs them
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      # Root deps (shared packages, Tauri CLI wrapper, etc.)
      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      # ── Build web frontend ─────────────────────────────────────────────────────
      # Build the React app that Tauri will bundle into the desktop binary.
      # VITE_API_URL is intentionally left as /api/v1 (relative) so the desktop
      # app talks to whatever server URL is configured in the setup wizard.
      - name: Build web frontend
        working-directory: apps/web
        env:
          VITE_API_URL: /api/v1
          NODE_ENV: production
        run: npm run build

      # ── Tauri build + GitHub Release ───────────────────────────────────────────
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing keys (generate with: tauri signer generate)
          # Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repo Secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing — remove/leave blank if not signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          # Tag-based releases use the tag name; workflow_dispatch uses input
          tagName: ${{ github.ref_name || format('desktop-v{0}', github.event.inputs.version) }}
          releaseName: 'KASTRA POS Desktop ${{ github.ref_name || github.event.inputs.version }}'
          releaseBody: |
            ## KASTRA POS Desktop — ${{ github.ref_name || github.event.inputs.version }}

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows 10/11 | `.msi` | Recommended installer |
            | Windows | `.exe` | NSIS setup |
            | macOS 11+ Intel | `.dmg` | For Intel Macs |
            | macOS 11+ Apple Silicon | `.dmg` | For M1/M2/M3 Macs |
            | Ubuntu/Debian | `.deb` | `sudo dpkg -i kastra-pos_*.deb` |
            | Linux (all) | `.AppImage` | Portable — `chmod +x` then run |

            ### First-time Setup
            1. Download and install for your platform
            2. Launch the app — the **Setup Wizard** opens automatically
            3. Choose your network topology (Standalone / Server / Client)
            4. Enter your server URL (if Client or Cloud mode)
            5. Log in with your KASTRA POS credentials

            ### What's included
            - Full POS, Inventory, Reports, HR, Payroll in a native window
            - **VSCU offline eTIMS** — queues KRA submissions when offline
            - **LAN sync** — sync across terminals without internet
            - **Auto-update** notifications when a new version is available
            - Machine-bound license validation

            ### Upgrading
            The app will notify you automatically when a new version is available.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
