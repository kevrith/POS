services:
  - type: web
    name: kastra-api
    runtime: node
    region: frankfurt        # Frankfurt is closest to Kenya (low latency)
    plan: free               # Free tier — sleeps after 15 min inactivity; upgrade to starter ($7/mo) for always-on
    buildCommand: npm ci && bash scripts/render-build.sh
    startCommand: node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && cd apps/api && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns a port via $PORT; NestJS already reads process.env.PORT
      - key: DATABASE_URL
        sync: false           # Paste your Supabase / Neon / external PostgreSQL connection string here
                              # Format: postgresql://user:password@host:5432/dbname?sslmode=require
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a random secret
      - key: ENCRYPTION_KEY
        sync: false           # 64 hex chars — generate with: openssl rand -hex 32
      - key: FRONTEND_URL
        sync: false           # e.g. https://kastra-pos.vercel.app
      - key: ADMIN_URL
        sync: false           # e.g. https://kastra-admin.vercel.app
      - key: EXTRA_ORIGINS
        sync: false           # Comma-separated extra allowed origins (optional)
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_SECRET
        generateValue: true
      - key: ETIMS_ENV
        value: test           # Change to "production" once KRA approves your eTIMS credentials
      - key: MPESA_ENV
        value: sandbox        # Change to "production" with live credentials
      - key: KEEP_ALIVE
        value: true           # Enables self-ping every 14 min to reduce cold starts on free tier

# ─── DATABASE ────────────────────────────────────────────────────────────────
# Render's free PostgreSQL expires after 90 days — data gets DELETED.
# Use Supabase (free, permanent) instead:
#   1. Go to supabase.com → New project → Settings → Database → Connection string
#   2. Copy the URI (use "Transaction" mode pooler for serverless, or direct for persistent)
#   3. Paste it as DATABASE_URL in the Render dashboard
#
# Uncomment the section below ONLY if you want Render's built-in DB (dev/testing only):
#
# databases:
#   - name: kastra-db
#     databaseName: kastra_pos
#     user: kastra
#     plan: free             # WARNING: deleted after 90 days — use Supabase for production
#     region: frankfurt
