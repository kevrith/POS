name: Mobile Apps Release

on:
  push:
    tags:
      - 'mobile-v*'   # git tag mobile-v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
      app:
        description: 'Which app to build'
        required: true
        default: 'all'
        type: choice
        options: [all, mobile-pos, mobile-customer, mobile-driver, mobile-agent]

permissions:
  contents: write  # needed to create/update GitHub releases

jobs:

  # ── KASTRA POS Cashier App ────────────────────────────────────────────────────
  build-pos:
    name: Android — KASTRA POS (Cashier)
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-pos' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-pos/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-pos
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-pos
        run: rm -rf android ios .expo

      - name: Build Android APK (local)
        working-directory: apps/mobile-pos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/kastra-pos-cashier.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kastra-pos-cashier-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-pos/build/kastra-pos-cashier.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## KASTRA POS Cashier APK" >> $GITHUB_STEP_SUMMARY
          echo "Build: \`${{ github.ref_name || 'manual' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Profile: \`${{ github.event.inputs.profile || 'preview' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── KASTRA Order (Customer Self-Service) App ──────────────────────────────────
  build-customer:
    name: Android — KASTRA Order (Customer)
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-customer' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-customer/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-customer
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-customer
        run: rm -rf android ios .expo

      - name: Build Android APK (local)
        working-directory: apps/mobile-customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/kastra-order-customer.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kastra-order-customer-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-customer/build/kastra-order-customer.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## KASTRA Order (Customer) APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── KASTRA Driver App ─────────────────────────────────────────────────────────
  build-driver:
    name: Android — KASTRA Driver
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-driver' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-driver/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-driver
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-driver
        run: rm -rf android ios .expo

      - name: Build Android APK (local)
        working-directory: apps/mobile-driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/kastra-driver.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kastra-driver-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-driver/build/kastra-driver.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## KASTRA Driver APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── KASTRA Agent App (Field Sales) ────────────────────────────────────────────
  build-agent:
    name: Android — KASTRA Agent
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-agent' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-agent/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-agent
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-agent
        run: rm -rf android ios .expo

      # The agent app has no committed extra.eas.projectId yet (unlike the other
      # three apps). Link/create it non-interactively using EXPO_TOKEN so the
      # build can run. First run creates @kevrith/kastra-agent; later runs link
      # the same project by owner+slug. To make this permanent and skip the
      # step, run `eas init` locally once and commit app.json.
      - name: Ensure EAS project is linked
        working-directory: apps/mobile-agent
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already set in app.json — skipping init"
          else
            eas init --non-interactive --force
          fi

      - name: Build Android APK (local)
        working-directory: apps/mobile-agent
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/kastra-agent.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kastra-agent-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-agent/build/kastra-agent.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## KASTRA Agent APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── Publish: create/update rolling mobile-latest GitHub Release ───────────────
  publish:
    name: Publish mobile-latest GitHub Release
    needs: [build-pos, build-customer, build-driver, build-agent]
    # Publishes whenever ANY app built. It used to require app=all or a tag, so a
    # single-app run produced an APK that never reached the release — the download
    # link kept serving the old build and the fix looked like it had not shipped.
    # Safe now that uploads replace only the assets this run rebuilt.
    if: >
      always() &&
      (needs.build-pos.result == 'success' || needs.build-customer.result == 'success' || needs.build-driver.result == 'success' || needs.build-agent.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-apks
          merge-multiple: true

      - name: List downloaded artifacts
        run: find downloaded-apks -name '*.apk' | sort

      # Deleting the release first meant a partial run wiped the APKs it did not
      # rebuild: if one app failed, the other three published and the failed app's
      # download link 404'd until the next fully green run. Create it only when it
      # is missing, then overwrite asset by asset, so untouched apps keep the last
      # good APK.
      - name: Ensure mobile-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-latest --repo kevrith/POS >/dev/null 2>&1 && exit 0
          echo "mobile-latest does not exist yet — creating it"
          gh release create mobile-latest \
            --repo kevrith/POS \
            --title "KASTRA Mobile Apps — Latest Build" \
            --notes "Populated by the Mobile Apps Release workflow." \
            --latest=false

      - name: Upload APKs, replacing only what this run rebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          found=$(find downloaded-apks -name '*.apk')
          if [ -z "$found" ]; then
            echo "::error::No APKs were produced — leaving the existing release untouched"
            exit 1
          fi
          echo "$found" | xargs gh release upload mobile-latest --repo kevrith/POS --clobber

      - name: Refresh the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit mobile-latest \
            --repo kevrith/POS \
            --title "KASTRA Mobile Apps — Latest Build" \
            --notes "$(cat <<'EOF'
          ## KASTRA Mobile Apps — Latest Build

          Auto-updated every time a new `mobile-v*` tag is pushed.

          ### Direct Download Links
          | App | Platform | Link |
          |-----|----------|------|
          | **KASTRA POS** (Cashier) | Android | [kastra-pos-cashier.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-pos-cashier.apk) |
          | **KASTRA Order** (Customer) | Android | [kastra-order-customer.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-order-customer.apk) |
          | **KASTRA Driver** | Android | [kastra-driver.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-driver.apk) |
          | **KASTRA Agent** (Field Sales) | Android | [kastra-agent.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-agent.apk) |

          ### Install on Android
          1. Download the APK on your Android phone
          2. Open the file — Android will ask to allow installs from unknown sources
          3. Tap **Install**

          > iOS builds require TestFlight. Contact support for enterprise distribution.
          EOF
          )"

      - name: Write job summary
        run: |
          echo "## Mobile Apps Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct download links (always point to latest build):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Download |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| KASTRA POS (Cashier) | [kastra-pos-cashier.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-pos-cashier.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| KASTRA Order (Customer) | [kastra-order-customer.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-order-customer.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| KASTRA Driver | [kastra-driver.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-driver.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| KASTRA Agent | [kastra-agent.apk](https://github.com/kevrith/POS/releases/download/mobile-latest/kastra-agent.apk) |" >> $GITHUB_STEP_SUMMARY
