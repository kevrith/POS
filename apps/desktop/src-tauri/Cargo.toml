[package]
name = "kastra-pos-desktop"
version = "1.0.0"
edition = "2021"
description = "KASTRA POS Desktop - Enterprise POS for Kenya"

[dependencies]
tauri = { version = "2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs-next = "2"
hostname = "0.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
